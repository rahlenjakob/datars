[package]
name = "datars-mcp"
description = "An MCP server (stdio) exposing datars to coding agents: check, render, film, inspect, lint, test, describe, bundle."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "visualization", "charts", "agents", "data-visualization"]
categories = ["development-tools", "visualization"]

[[bin]]
name = "datars-mcp"
path = "src/main.rs"

[dependencies]
datars-engine = { workspace = true, features = ["sandbox", "bundled-fonts"] }
datars-headless.workspace = true
datars-render-cpu.workspace = true
datars-devtools.workspace = true
datars-scene.workspace = true
datars-test.workspace = true
datars-build.workspace = true
datars-bundle.workspace = true
datars-ir.workspace = true
serde_json.workspace = true
