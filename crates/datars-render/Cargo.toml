[package]
name = "datars-render"
description = "The datars display list: backend-neutral draw ops over content-addressed resources, and scene flattening."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
datars-math.workspace = true
datars-color.workspace = true
datars-theme.workspace = true
datars-scene.workspace = true
serde.workspace = true
png = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
image-webp = { workspace = true, optional = true }

[features]
# Decoders in Rust, for builds with no platform decoder (the tools, headless renders, the desktop
# host). Platform hosts (web, iOS, Android) decode with their own and hand in RGBA.
png = ["dep:png"]
# The portable scalar decoder (no SIMD paths): the same pixels on every target.
jpeg = ["dep:zune-jpeg"]
# WebP (lossy and lossless, with alpha): the tools' decoder for what browsers and apps read natively.
webp = ["dep:image-webp"]

[dev-dependencies]
png.workspace = true
