[package]
name = "datars-ffi"
description = "C ABI for the datars runtime — wrapped by the Swift package (iOS/macOS) and the Kotlin library (Android)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
datars-runtime.workspace = true
serde_json.workspace = true
datars-render-wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
# wgpu's warnings (why a surface or device failed) forwarded to logcat. Already in the tree.
log = "0.4"

[features]
default = ["sandbox", "bundled-fonts", "gpu"]
# Frames on the GPU (wgpu): Metal on an app's CAMetalLayer (iOS, macOS), Vulkan or GLES on an
# Android Surface. Until a surface is attached — and without this feature — frames are CPU pixels
# (`datars_view_pixels`), which is also what the goldens compare.
gpu = ["dep:datars-render-wgpu"]
# T3 bundles (recipes expanded on the device). Apps that forbid on-device scripts build without it.
sandbox = ["datars-runtime/sandbox"]
# The default family (Inter, ~320 KB) compiled into the library, so raw documents in the hosts'
# development mode (`DatarsSource.document`, `loadDocument`) draw text without a bundle. Bundles
# carry their own font chunks: apps that only play bundles can build without it.
bundled-fonts = ["datars-runtime/bundled-fonts"]
