[package]
name = "datars-cli"
description = "The datars command line: live dev server, render (PNG/SVG/PDF), film and video, lint, visual and motion tests, profile, bundle and publish."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["visualization", "charts", "animation", "cli", "data-visualization"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "datars"
path = "src/main.rs"

[dependencies]
datars-engine = { workspace = true, features = ["sandbox", "bundled-fonts"] }
datars-headless.workspace = true
datars-devtools.workspace = true
datars-render-cpu.workspace = true
datars-render-wgpu.workspace = true
datars-render-svg.workspace = true
datars-test = { workspace = true, features = ["gpu"] }
datars-build.workspace = true
datars-bundle.workspace = true
datars-scene.workspace = true
datars-math.workspace = true
flate2.workspace = true
datars-ir = { workspace = true, features = ["schema"] }
datars-theme.workspace = true
serde_json.workspace = true
getrandom.workspace = true
