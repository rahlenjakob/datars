<!doctype html>
<!-- The spending chart in a web app: the chart is a file the app ships (built once, not per user);
     the signed-in user's rows are fetched by the app and handed to it in the browser.

       datars bundle ../doc.ts --out spending.datars     # once, at build time
       datars serve .                                    # then open http://127.0.0.1:8787/index.html
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your spending</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d1f24; }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px; }
  .card { background: #fff; border-radius: 14px; padding: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  datars-view { display: block; }
  nav { display: flex; gap: 8px; margin: 12px 0; }
  button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 1px solid #d0d3d9; background: #fff; }
</style>
<script type="module" src="/runtime/datars.js"></script>
<main>
  <h1>Hi Alex</h1>
  <nav><button data-user="user.json">This account</button><button data-user="other.json">Another account</button></nav>
  <div class="card"><datars-view id="chart" src="spending.datars" height="520"></datars-view></div>
</main>
<script type="module">
  const chart = document.getElementById("chart");
  // The app's own API call; the rows never go anywhere else. Until they arrive the chart shows its
  // sample. Switching accounts hands in other rows: the chart transitions to them.
  async function show(url) {
    const rows = await (await fetch(url)).json();
    try { chart.data = { spending: rows }; } catch (e) { console.error(e); }
  }
  for (const b of document.querySelectorAll("button")) b.onclick = () => show(b.dataset.user);
  show("user.json");
</script>
