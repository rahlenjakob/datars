[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "datars"
version = "0.1.0"
description = "Animated, themed data graphics from DataFrames — live in Jupyter, identical as PNG/SVG/PDF/MP4."
readme = "README.md"
license = { text = "Proprietary. Copyright (c) 2026 Jakob Råhlén. All rights reserved." }
requires-python = ">=3.9"
authors = [{ name = "Jakob Råhlén" }]
keywords = ["visualization", "charts", "jupyter", "pandas", "animation", "data-visualization"]
classifiers = [
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
# The core has no required dependencies: dicts and lists work; pandas, polars and numpy are
# used when you pass them (numpy for hist).
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5", "numpy>=1.22"]
# Live, two-way charts in JupyterLab / Notebook 7 / VS Code / Colab, offline.
widget = ["anywidget>=0.9"]
all = ["pandas>=1.5", "numpy>=1.22", "anywidget>=0.9"]
test = ["pytest>=7", "pandas>=1.5", "numpy>=1.22", "jsonschema>=4"]

[project.urls]
Homepage = "https://datars.dev"
Documentation = "https://github.com/rahlenjakob/datars/tree/main/docs/guides/python.md"
Repository = "https://github.com/rahlenjakob/datars"
Issues = "https://github.com/rahlenjakob/datars/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# _runtime/ is vendored from packages/web/dist by tools/vendor_runtime.py before a build (not in git).
datars = ["_recipes.json", "_static/*.js", "_runtime/*.js", "_runtime/wasm/*", "_runtime/fonts/*", "_runtime/atlas/*", "_bin/*", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/datars"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
